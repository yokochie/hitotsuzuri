<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひとつづり — 詳細モック</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0ed;color:#263026;font:14px -apple-system,BlinkMacSystemFont,sans-serif;padding:20px}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #1768b2;outline-offset:2px}button:disabled{cursor:default;opacity:.5}.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:1320px;margin:0 auto 16px}.tools h1{font-size:18px;margin:0 auto 0 0}.tools select,.tools button{padding:7px;border:1px solid #adb8a7;border-radius:5px;background:white}.note{max-width:1320px;margin:12px auto;font-size:12px;color:#56634f;line-height:1.7}.window{max-width:1320px;margin:auto;border:1px solid #bdc7b7;border-radius:12px;overflow:hidden;background:#fcfdfb;box-shadow:0 15px 40px #26302615}.bar{height:50px;background:#f4f6f1;border-bottom:1px solid #d9dfd3;display:flex;align-items:center;gap:14px;padding:0 16px}.dots{color:#8b9982;letter-spacing:4px}.bar strong{font-size:13px}.bar small{margin-left:auto;color:#59654f}.tabs{display:none;gap:5px}.tabs button{border:1px solid #b9c5b0;border-radius:4px;padding:6px;background:white}.workspace{height:650px;max-height:calc(100dvh - 200px);min-height:450px;display:grid;grid-template-columns:190px 215px minmax(300px,1fr)}aside,.albums{padding:22px 12px;border-right:1px solid #dde3d6;overflow:auto}aside{background:#f0f3ed}h2{font-size:12px;color:#53634b;margin:0 8px 16px}.row{display:flex;align-items:center;margin:4px 0}.row button,.album{border:0;background:transparent;color:inherit;padding:10px;border-radius:5px;text-align:left}.row .folder{flex:1}.row .child{padding-left:28px}.row button[aria-pressed=true],.album[aria-pressed=true]{background:#dce7d4}.row .expand{padding:8px;width:30px}.album{width:100%;display:block;margin:4px 0}.hint{font-size:11px;color:#58674f;line-height:1.8;margin:20px 8px}.detail{display:flex;flex-direction:column;min-height:0;min-width:0}.detail header{padding:22px 24px 15px}.detail h2{font-size:23px;color:#263026;margin:0 0 8px}.detail header p{margin:0;color:#57644f;font-size:12px}.grid{flex:1;min-height:0;overflow:auto;padding:0 24px 20px;display:grid;grid-template-columns:repeat(3,minmax(60px,1fr));gap:12px;align-content:start}.photo{aspect-ratio:1;position:relative;border:3px solid transparent;padding:0;border-radius:6px;background:#dfe5da;overflow:hidden}.photo[aria-pressed=true]{border-color:#41602f}.art{display:block;width:100%;height:100%;background:var(--scene);position:relative}.art:after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:#f3e7bf70;top:12%;right:15%}.n{position:absolute;right:5px;top:5px;background:#355524;color:white;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:12px}.caption{position:absolute;left:5px;bottom:5px;background:#fffffff0;color:#263026;border-radius:3px;padding:3px 5px;font-size:10px}.photo.unavailable{opacity:1;background:#e1e3df;color:#56614d;display:grid;place-items:center}.tray{border-top:1px solid #d8dfd0;padding:16px 24px;background:#f6f8f2;flex-shrink:0}.trayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px}.slots{display:flex;gap:9px}.slot{width:62px;height:62px;border:1px dashed #a9b99d;border-radius:5px;overflow:hidden;position:relative;display:grid;place-items:center;color:#617354;font-size:12px}.slot.filled{border:2px solid #52723e}.slot .n{width:18px;height:18px;font-size:10px;right:2px;top:2px}.bottom{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px}.message{font-size:12px;color:#405a31;line-height:1.7;flex:1}.message.error{color:#8b3829}.primary{border:0;padding:10px 16px;border-radius:6px;background:#41602f;color:white;white-space:nowrap}.retry{padding:6px 9px;background:white;border:1px solid #a7b69a;border-radius:5px;margin-left:8px}.screen{padding:50px 28px;max-width:550px;margin:auto;line-height:1.9;text-align:center}.screen h2{font-size:24px;color:#263026}.screen p{color:#53634a}.placeholder{grid-column:1/-1;padding:45px 12px;color:#53634a;line-height:1.9}[hidden]{display:none!important}@media(max-width:1050px){.workspace{grid-template-columns:160px 175px minmax(280px,1fr)}.grid{grid-template-columns:repeat(2,minmax(60px,1fr))}}@media(max-width:820px){body{padding:12px}.workspace{display:block;height:650px}.workspace aside,.workspace .albums,.workspace .detail{display:none;height:100%}.workspace[data-panel=folders] aside,.workspace[data-panel=albums] .albums{display:block}.workspace[data-panel=photos] .detail{display:flex}.tabs{display:flex;margin-left:auto}.bar small{display:none}.grid{grid-template-columns:repeat(3,minmax(60px,1fr))}.tray,.detail header{padding-left:16px;padding-right:16px}.grid{padding-left:16px;padding-right:16px}.bottom{align-items:start}.slot{width:54px;height:54px}}
.photo{width:100%;height:auto;align-self:start}.photo>.art,.slot>.art{position:absolute;inset:0}.grid{grid-auto-rows:max-content}
</style>
<div class="tools"><h1>ひとつづり / 詳細モック</h1><label>確認する状態 <select id="scenario"><option value="normal">通常の選択</option><option value="permission">初回の許可</option><option value="denied">アクセス拒否</option><option value="restricted">アクセス制限</option><option value="loading">読み込み中</option><option value="empty">写真なし</option><option value="offline">取得できない写真</option><option value="saving">検証・保存中</option><option value="failure">保存失敗</option><option value="invalid">無効な参照</option><option value="restoring">復元中</option><option value="restored">復元成功</option><option value="missing">復元時の欠損</option></select></label><button id="reset">最初から試す</button></div>
<div class="window"><div class="bar"><span class="dots" aria-hidden="true">● ● ●</span><strong>ひとつづり</strong><nav class="tabs" aria-label="領域切替"><button data-panel="folders">フォルダ</button><button data-panel="albums">アルバム</button><button data-panel="photos">写真</button></nav><small>実写真へのアクセスなし</small></div><section id="gate" class="screen" hidden></section><div id="work" class="workspace" data-panel="photos"><aside aria-label="フォルダ"><h2>フォルダ</h2><div class="row"><button id="expand" class="expand" aria-label="撮影記録の階層を折り畳む" aria-expanded="true">▾</button><button class="folder" data-id="record" aria-pressed="true">撮影記録</button></div><div id="children"><div class="row"><button class="folder child" data-id="portrait" aria-pressed="false">人物</button></div><div class="row"><button class="folder child" data-id="landscape" aria-pressed="false">風景</button></div></div><div class="row"><button class="folder" data-id="archive" aria-pressed="false">アーカイブ</button></div><p class="hint">⌘ を押しながらクリックで複数選択。階層の展開と選択は別操作です。</p></aside><section class="albums" aria-label="アルバム"><h2>アルバム</h2><div id="albums"></div></section><section class="detail" aria-label="写真と選択内容"><header><h2 id="title">光のある午後</h2><p>写真を4枚選択。並べ替えは解除・再選択で行います。</p></header><div class="grid" id="grid" aria-label="写真一覧"></div><footer class="tray"><div class="trayhead"><span id="saveState">未確定</span><strong id="count">0 / 4枚</strong></div><div class="slots" id="slots" aria-label="選択した写真の順序付きプレビュー"></div><div class="bottom"><div class="message" id="message" role="status" aria-live="polite"></div><button class="retry" id="retry" hidden>再試行</button><button class="primary" id="confirm" disabled>選択を確定</button></div></footer></section></div></div>
<p class="note">仮画像による操作モックです。実際の権限要求・写真取得・ファイル保存・再起動復元は行いません。「状態」の切替は確認用で、製品には配置しません。キーボードはTab / Shift+Tabで移動し、SpaceまたはEnterで実行できます。</p>
<script>
const $=s=>document.querySelector(s), data=[{id:'light',name:'光のある午後',folder:'landscape',n:12},{id:'portrait',name:'ポートレート習作',folder:'portrait',n:9},{id:'archive',name:'静かな街角',folder:'archive',n:6}];
let selected=[], saved=null, current='light',folders=new Set(['record']),state='normal', busy=false, timer;
const scenes=['linear-gradient(170deg,#c4d3cd 0 45%,#829a7e 46% 65%,#42583a 66%)','linear-gradient(135deg,#d9cfb0 0 28%,#738069 29% 44%,#adb69e 45% 72%,#646d4b 73%)','linear-gradient(175deg,#d4d9d0 0 40%,#8b9e8a 41% 55%,#506b59 56% 80%,#b6b99d 81%)','linear-gradient(150deg,#b5c7ce 0 45%,#d5c9a7 46% 64%,#727553 65%)'];
function art(id){let a=document.createElement('span');a.className='art';a.style.setProperty('--scene',scenes[(id-1)%4]);a.setAttribute('aria-hidden','true');return a}
function visible(){return data.filter(a=>folders.has(a.folder)||(folders.has('record')&&a.folder!=='archive'))}
function message(text,error=false){$('#message').textContent=text;$('#message').classList.toggle('error',error)}
function setScenario(value){clearTimeout(timer);state=value;busy=value==='saving';selected=['saving','failure','invalid','restored'].includes(value)?[1,2,3,4]:[];saved=value==='restored'?{album:current,ids:[1,2,3,4]}:null;render()}
function render(){const gates={permission:['写真へのアクセス','アルバムから4枚を選び、選択内容を保存します。写真ライブラリの内容は変更しません。','写真へのアクセスを許可'],denied:['写真にアクセスできません','システム設定で、ひとつづりの写真アクセスを確認してください。',null],restricted:['写真へのアクセスが制限されています','このMacの利用制限を確認してください。設定だけでは解除できない場合があります。',null],restoring:['前回の選択を確認しています','保存したフォルダと4枚の参照を確認中です。',null]};const gate=gates[state];$('#gate').hidden=!gate;$('#work').hidden=!!gate;if(gate){$('#gate').replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=gate[0];p.textContent=gate[1];$('#gate').append(h,p);if(gate[2]){const b=document.createElement('button');b.className='primary';b.textContent=gate[2];b.onclick=()=>{$('#scenario').value='normal';setScenario('normal')};$('#gate').append(b)}return}
$('#albums').replaceChildren();for(const album of visible()){const b=document.createElement('button');b.className='album';b.textContent=album.name;b.title=album.name;b.disabled=busy;b.setAttribute('aria-pressed',String(current===album.id));b.onclick=()=>{if(current!==album.id){current=album.id;selected=[];state='normal'}render();$('#work').dataset.panel='photos'};$('#albums').append(b)}
for(const f of document.querySelectorAll('.folder')){f.disabled=busy;f.setAttribute('aria-pressed',String(folders.has(f.dataset.id)))}$('#expand').disabled=busy;
const album=visible().find(a=>a.id===current);$('#title').textContent=album?.name??'アルバムを選択';$('#grid').replaceChildren();if(!album||['loading','empty'].includes(state)){let p=document.createElement('p');p.className='placeholder';p.textContent=!album?'対象フォルダとアルバムを選択してください。':state==='loading'?'写真を読み込んでいます…':'このアルバムには写真がありません。';$('#grid').append(p)}else for(let id=1;id<=album.n;id++){const b=document.createElement('button'),index=selected.indexOf(id),unavailable=state==='offline'&&id===3;b.className='photo'+(unavailable?' unavailable':'');b.disabled=busy||unavailable;b.setAttribute('aria-pressed',String(index>=0));b.setAttribute('aria-label','写真 '+id+(unavailable?'、画像を取得できません':index>=0?'、選択順 '+(index+1):'、未選択'));if(unavailable)b.textContent='取得できません';else b.append(art(id));const cap=document.createElement('span');cap.className='caption';cap.textContent='写真 '+String(id).padStart(2,'0');b.append(cap);if(index>=0){const n=document.createElement('span');n.className='n';n.textContent=index+1;b.append(n)}b.onclick=()=>{const i=selected.indexOf(id);if(i>=0)selected.splice(i,1);else if(selected.length<4)selected.push(id);else{message('選択できる写真は4枚までです。');return}if(['failure','invalid','missing','restored'].includes(state))state='normal';render()};$('#grid').append(b)}
$('#slots').replaceChildren();for(let i=0;i<4;i++){let s=document.createElement('div');s.className='slot'+(selected[i]?' filled':'');s.setAttribute('aria-label','選択順 '+(i+1)+(selected[i]?'、写真 '+selected[i]:'、未選択'));if(selected[i]){s.append(art(selected[i]));const n=document.createElement('span');n.className='n';n.textContent=i+1;s.append(n)}else s.textContent=i+1;$('#slots').append(s)}
const clean=saved&&saved.album===current&&JSON.stringify(saved.ids)===JSON.stringify(selected);$('#count').textContent=selected.length+' / 4枚';$('#saveState').textContent=busy?'保存中':clean?'保存済み':saved?'未保存の変更':'未確定';$('#confirm').disabled=busy||selected.length!==4||state==='invalid';$('#retry').hidden=state!=='failure';$('#confirm').textContent=busy?'保存しています…':'選択を確定';
if(busy)message('選択内容を確認・保存しています。完了までお待ちください。');else if(state==='failure')message('保存できませんでした。選択内容を保っています。再試行してください。',true);else if(state==='invalid')message('写真またはアルバムを確認できません。アプリを再起動して選び直してください。',true);else if(state==='missing')message('前回の選択に欠損があるため、4枚すべての選択を解除しました。',true);else if(state==='offline')message('取得できない写真は選べません。写真アプリで準備し、再起動してください。');else if(clean)message('選択を保存しました（モック表示）。');else message(selected.length===4?'4枚そろいました。選択順をご確認ください。':'あと'+(4-selected.length)+'枚選ぶと確定できます。');}
function save(){busy=true;state='saving';render();timer=setTimeout(()=>{saved={album:current,ids:[...selected]};busy=false;state='normal';$('#scenario').value='normal';render();$('#confirm').focus()},900)}
$('#confirm').onclick=save;$('#retry').onclick=save;$('#scenario').onchange=e=>setScenario(e.target.value);$('#reset').onclick=()=>{$('#scenario').value='normal';current='light';folders=new Set(['record']);setScenario('normal')};
for(const f of document.querySelectorAll('.folder'))f.onclick=e=>{if(e.metaKey||e.ctrlKey){folders.has(f.dataset.id)?folders.delete(f.dataset.id):folders.add(f.dataset.id)}else folders=new Set([f.dataset.id]);if(!visible().some(a=>a.id===current)){current=null;selected=[]}render()};
$('#expand').onclick=()=>{const open=$('#expand').getAttribute('aria-expanded')==='true';$('#expand').setAttribute('aria-expanded',String(!open));$('#expand').textContent=open?'▸':'▾';$('#expand').setAttribute('aria-label','撮影記録の階層を'+(open?'展開する':'折り畳む'));$('#children').hidden=open};for(const b of document.querySelectorAll('.tabs button'))b.onclick=()=>{$('#work').dataset.panel=b.dataset.panel;const region=b.dataset.panel==='folders'?'aside':b.dataset.panel==='albums'?'.albums':'.detail';$('#work '+region+' button:not(:disabled)')?.focus()};render();
</script></html>
