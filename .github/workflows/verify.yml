name: Verify native application
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-core:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/codex/phase2-u2-draft-experience' && contains(github.event.head_commit.message, '[input-focus]')) }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check test selection contracts
        run: python3 scripts/test-native-runner.py
      - name: Record Core environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m
          sysctl -n hw.model
          pmset -g batt
      - name: Verify every Core target before starting UI
        run: bash scripts/verify-native.sh --core
  native:
    needs: native-core
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HZS_CORE_PREFLIGHT_DONE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record operating system and Xcode SDK
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          uname -m
          sysctl -n hw.model
          pmset -g batt
          if defaults read -g AppleKeyboardUIMode; then
            echo "Keyboard navigation preference is explicitly configured."
          else
            echo "Keyboard navigation preference is not explicitly configured."
          fi
      - name: Verify smoke, full functional regression and product coverage
        run: bash scripts/verify-native.sh --functional
  input-focus-diagnostic:
    # This branch-only diagnostic does not satisfy the full verification gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/phase2-u2-draft-experience' && contains(github.event.head_commit.message, '[input-focus]')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record diagnostic environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m
          sysctl -n hw.model
      - name: Check test selection contracts
        run: python3 scripts/test-native-runner.py
      - name: Verify smoke and two input focus cases only
        run: bash scripts/verify-native.sh --input-focus
  baseline-native:
    # Temporary diagnostic for this U1 branch: distinguish inherited failures
    # on the hosted image from changes introduced by article support.
    if: github.ref == 'refs/heads/codex/phase2-u1-article-foundation'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0e96d28407dc6b634ef492dcbbf7533e7c665c3a
          persist-credentials: false
      - name: Record baseline environment
        run: |
          sw_vers
          xcodebuild -version
      - name: Verify unchanged application on the same hosted image
        run: bash scripts/verify-native.sh
