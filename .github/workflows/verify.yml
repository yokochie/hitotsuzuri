name: Verify native application
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record operating system and Xcode SDK
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          if defaults read -g AppleKeyboardUIMode; then
            echo "Keyboard navigation preference is explicitly configured."
          else
            echo "Keyboard navigation preference is not explicitly configured."
          fi
      - name: Verify XCTest and product coverage
        run: bash scripts/verify-native.sh
      - name: Diagnose product coverage after test failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          native_results=(.build/Native-*.xcresult)
          if [[ ${#native_results[@]} -ne 1 ]]; then
            echo "Expected one result bundle from this clean checkout." >&2
            exit 1
          fi
          swift scripts/check-coverage.swift "${native_results[0]}"
  baseline-native:
    # Temporary diagnostic for this U1 branch: distinguish inherited failures
    # on the hosted image from changes introduced by article support.
    if: github.ref == 'refs/heads/codex/phase2-u1-article-foundation'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0e96d28407dc6b634ef492dcbbf7533e7c665c3a
          persist-credentials: false
      - name: Record baseline environment
        run: |
          sw_vers
          xcodebuild -version
      - name: Verify unchanged application on the same hosted image
        run: bash scripts/verify-native.sh
