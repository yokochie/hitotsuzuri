name: Verify native application
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      verify_all:
        description: Run the complete suite and weighted product coverage
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # Full verification can also run on the feature branch before this workflow reaches main.
    if: (github.event_name != 'workflow_dispatch' || !inputs.verify_all) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[verify-all]'))
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record operating system and Xcode SDK
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          if defaults read -g AppleKeyboardUIMode; then
            echo "Keyboard navigation preference is explicitly configured."
          else
            echo "Keyboard navigation preference is not explicitly configured."
          fi
      - name: Verify smoke and functional regression
        run: bash scripts/verify-native.sh --functional
  native-performance:
    if: (github.event_name != 'workflow_dispatch' || !inputs.verify_all) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[verify-all]'))
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify smoke and detailed performance
        run: bash scripts/verify-native.sh --performance
  native-all:
    # Partial jobs do not establish whole-product coverage. A [verify-all] push runs only this job.
    if: (github.event_name == 'workflow_dispatch' && inputs.verify_all) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-all]'))
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify complete suite and weighted product coverage
        run: bash scripts/verify-native.sh
  baseline-native:
    # Temporary diagnostic for this U1 branch: distinguish inherited failures
    # on the hosted image from changes introduced by article support.
    if: github.ref == 'refs/heads/codex/phase2-u1-article-foundation'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0e96d28407dc6b634ef492dcbbf7533e7c665c3a
          persist-credentials: false
      - name: Record baseline environment
        run: |
          sw_vers
          xcodebuild -version
      - name: Verify unchanged application on the same hosted image
        run: bash scripts/verify-native.sh
