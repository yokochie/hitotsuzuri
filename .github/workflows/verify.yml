name: Verify native application
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-core:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check test selection contracts
        run: python3 scripts/test-native-runner.py
      - name: Record Core environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m
          sysctl -n hw.model
          pmset -g batt
      - name: Verify every Core target before starting UI
        run: bash scripts/verify-native.sh --core
      - name: Verify fixture smoke before starting UI shards
        run: bash scripts/verify-native.sh --smoke
  native-ui:
    needs: native-core
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record operating system and Xcode SDK
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          uname -m
          sysctl -n hw.model
          pmset -g batt
          if defaults read -g AppleKeyboardUIMode; then
            echo "Keyboard navigation preference is explicitly configured."
          else
            echo "Keyboard navigation preference is not explicitly configured."
          fi
      - name: Verify UI shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/verify-native.sh "--ui-shard-$SHARD"
  native:
    if: always()
    needs: [native-core, native-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Core, smoke and both UI shards
        env:
          CORE_RESULT: ${{ needs.native-core.result }}
          UI_RESULT: ${{ needs.native-ui.result }}
        run: test "$CORE_RESULT" = success && test "$UI_RESULT" = success
