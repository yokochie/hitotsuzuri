name: Verify native application
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-core:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check test selection contracts
        run: python3 scripts/test-native-runner.py
      - name: Record Core environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m
          sysctl -n hw.model
          pmset -g batt
      - name: Verify every Core target before starting UI
        run: bash scripts/verify-native.sh --core
  native:
    needs: native-core
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HZS_CORE_PREFLIGHT_DONE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record operating system and Xcode SDK
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          uname -m
          sysctl -n hw.model
          pmset -g batt
          if defaults read -g AppleKeyboardUIMode; then
            echo "Keyboard navigation preference is explicitly configured."
          else
            echo "Keyboard navigation preference is not explicitly configured."
          fi
      - name: Verify smoke, full functional regression and product coverage
        run: bash scripts/verify-native.sh --functional
