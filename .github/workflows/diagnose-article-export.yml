name: Diagnose U3 fixed copy
on:
  push:
    branches: [codex/phase2-u2-draft-experience]
permissions:
  contents: read
jobs:
  fixed-copy:
    if: github.ref == 'refs/heads/codex/phase2-u2-draft-experience' && contains(github.event.head_commit.message, '[u3-copy-diagnostic]')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record operating system, Xcode and existing keyboard preference
        run: |
          sw_vers
          xcodebuild -version
          if defaults read -g AppleKeyboardUIMode; then
            echo "Keyboard navigation preference is explicitly configured."
          else
            echo "Keyboard navigation preference is not explicitly configured."
          fi
      - name: Diagnose exactly one synthetic fixed-copy case
        run: xcodebuild -project Hitotsuzuri.xcodeproj -scheme Hitotsuzuri -destination platform=macOS -only-testing:HitotsuzuriUITests/ArticleExportUITests/testFixedCompletionCopyDoesNotUseLaterEditorChanges -enableCodeCoverage YES -derivedDataPath .build/DerivedData -resultBundlePath .build/ArticleExport-copy-diagnostic.xcresult CODE_SIGN_IDENTITY=- test
      - name: Preserve only this synthetic app diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-fixed-copy-diagnostic-${{ github.sha }}
          path: .build/ArticleExport-copy-diagnostic.xcresult
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: warn
