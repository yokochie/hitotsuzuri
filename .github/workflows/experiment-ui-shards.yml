name: Experiment with parallel UI tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: experiment-ui-shards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ci-speedup'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify test selection contracts
        run: python3 scripts/test-native-runner.py
      - name: Verify Core
        run: bash scripts/verify-native.sh --core
      - name: Verify smoke
        run: bash scripts/verify-native.sh --smoke
  ui:
    needs: smoke
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run UI shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/verify-native.sh "--ui-shard-$SHARD"
  result:
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ci-speedup'
    needs: [smoke, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both UI shards
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: test "$SMOKE_RESULT" = success && test "$UI_RESULT" = success
